[package]
name = "abbot-monitor"
version.workspace = true
edition = "2024"
description = "TUI frame monitor for Abbot"

[[bin]]
name = "abbot-monitor"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
tui-input = "0.11"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
dirs = "6"
toml = "0.8"
