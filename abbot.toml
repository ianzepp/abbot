# Abbot configuration
# Edit this file to configure Abbot.

workspace = "/tmp"

[model]
provider = "openai"
model = "gpt-5.1"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[head]
model = "openai/gpt-5.1"
temperature = 1
heartbeat_tick = 30
debounce_ms = 500

[hand]
model = "openai/gpt-5.1"
temperature = 0.2
max_iters = 24

[mind]
model = "openai/gpt-5.1"
tick_interval = 60

# Optional: user system prompt compaction/caching (for Opencode-style prompts).
# When enabled, Abbot will compact the client-provided system prompt and cache it per session.
[prompt_cache]
enabled = true
model = "openai/gpt-5.1"
temperature = 0.2
max_tokens = 1200

[pool]
size = 2
timeout_secs = 300
