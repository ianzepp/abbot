[package]
name = "abbot"
version = "0.1.0"
edition = "2024"
description = "Persistent AI background bot framework"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
uuid = { version = "1.20.0", features = ["v4"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rand = "0.9.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde_yaml = "0.9"

[[bin]]
name = "abbot"
path = "src/bin/abbot.rs"

[[bin]]
name = "abbotd"
path = "src/bin/abbotd.rs"

[dev-dependencies]
tempfile = "3"
