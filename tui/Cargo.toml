[package]
name = "abbot-tui"
version = "0.1.0"
edition = "2024"
description = "TUI frame monitor for Abbot"

[[bin]]
name = "abbot-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
