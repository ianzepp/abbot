# Abbot Configuration
# API keys are referenced by env var name (e.g., "OPENAI_API_KEY")

[head]
model = "gpt-4.1"
base_url = "https://api.openai.com/v1"
api_key = "OPENAI_API_KEY"
temperature = 0.7
heartbeat_tick = 10
debounce_ms = 500

[hand]
model = "gpt-4.1-mini"
base_url = "https://api.openai.com/v1"
api_key = "OPENAI_API_KEY"
temperature = 0.2
max_iters = 24
max_output_chars_in_prompt = 12000
max_trace_entries_in_prompt = 6

[heart]
model = "gpt-4.1"
base_url = "https://api.openai.com/v1"
api_key = "OPENAI_API_KEY"
tick_interval = 60
