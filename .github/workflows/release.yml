name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Linux ARM64 disabled for now (OpenSSL cross-compilation issues)
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf abbot-${{ matrix.target }}.tar.gz abbot
          shasum -a 256 abbot-${{ matrix.target }}.tar.gz > abbot-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: abbot-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/abbot-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/abbot-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release on abbot-releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        with:
          repository: ianzepp/abbot-releases
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }}"

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract SHA256 values
        id: sha256
        run: |
          ARM64_SHA=$(cat artifacts/abbot-aarch64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          X86_64_SHA=$(cat artifacts/abbot-x86_64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          LINUX_SHA=$(cat artifacts/abbot-x86_64-unknown-linux-gnu.tar.gz.sha256 | awk '{print $1}')
          echo "arm64=$ARM64_SHA" >> $GITHUB_OUTPUT
          echo "x86_64=$X86_64_SHA" >> $GITHUB_OUTPUT
          echo "linux=$LINUX_SHA" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: ianzepp/homebrew-tap
          token: ${{ secrets.RELEASES_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
          ARM64_SHA: ${{ steps.sha256.outputs.arm64 }}
          X86_64_SHA: ${{ steps.sha256.outputs.x86_64 }}
          LINUX_SHA: ${{ steps.sha256.outputs.linux }}
        run: |
          cd homebrew-tap
          # Strip 'v' prefix for version number
          VER=${VERSION#v}

          # Update version
          sed -i "s/version \".*\"/version \"$VER\"/" Formula/abbot.rb

          # Update download URLs
          sed -i "s|/download/v[^/]*/|/download/$VERSION/|g" Formula/abbot.rb

          # Update SHA256 values
          sed -i "0,/sha256 \"[a-f0-9]\{64\}\"/s//sha256 \"$ARM64_SHA\"/" Formula/abbot.rb
          sed -i "0,/sha256 \"[a-f0-9]\{64\}\"/s//sha256 \"$X86_64_SHA\"/" Formula/abbot.rb
          sed -i "0,/sha256 \"[a-f0-9]\{64\}\"/s//sha256 \"$LINUX_SHA\"/" Formula/abbot.rb

          cat Formula/abbot.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/abbot.rb
          git commit -m "Update abbot to ${{ github.ref_name }}"
          git push
